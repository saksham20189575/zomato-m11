[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zomato-m11"
version = "0.1.0"
description = "AI-powered restaurant recommendation system inspired by Zomato"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "datasets>=2.19.0",
    "pandas>=2.2.0",
    "openai>=1.40.0",
    "truststore>=0.10.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
ui = [
    "streamlit>=1.32.0",
]
api = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
zomato-recommend = "app.main:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["recommender*", "app*"]

[tool.setuptools.package-dir]
"" = "src"
"app" = "app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
