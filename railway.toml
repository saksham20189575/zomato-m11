# Railway deploy config for the TasteRank FastAPI backend.
# Frontend (web/) is deployed separately on Vercel — see docs/deployment-plan.md.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "uvicorn app.api:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
