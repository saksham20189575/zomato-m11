# Railway deploy config for the TasteRank FastAPI backend.
# Frontend (web/) is deployed separately on Vercel — see docs/deployment-plan.md.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Use the shell script so $PORT is expanded (Railway may not expand vars in a bare
# "uvicorn ... --port $PORT" startCommand, which causes: Invalid value for '--port').
startCommand = "sh scripts/start_api.sh"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
