# Railway deploy config for the TasteRank FastAPI backend.
# Frontend (web/) is deployed separately on Vercel — see docs/deployment-plan.md.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Do not use "uvicorn ... --port $PORT". Railway does not expand $PORT in a
# custom start command, which crashes uvicorn. This command has no $ variables.
startCommand = "python scripts/serve.py"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
